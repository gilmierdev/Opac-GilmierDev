appId: com.opac.librarysystem
productName: OPAC Library System
copyright: Copyright © 2026 GilmierDev

directories:
  output: release
  buildResources: build

files:
  - out/**
  - node_modules/**
  - package.json

asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@embedded-postgres/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OPAC Library System
  artifactName: OPAC-Library-System-Setup-${version}.${ext}
  uninstallDisplayName: OPAC Library System
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

npmRebuild: false